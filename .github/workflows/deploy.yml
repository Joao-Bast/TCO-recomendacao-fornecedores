name: Testes e deploy no Cloud Run

on:
  push:
    branches: [master]

jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: pytest

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/254798258391/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@project-859a403e-4363-4c9b-963.iam.gserviceaccount.com'

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy tco-app \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --add-cloudsql-instances project-859a403e-4363-4c9b-963:southamerica-east1:tco-fornecedores-db \
            --set-env-vars DB_NAME=tcc_fornecedores,DB_USER=postgres,INSTANCE_CONNECTION_NAME=project-859a403e-4363-4c9b-963:southamerica-east1:tco-fornecedores-db \
            --set-secrets DB_PASSWORD=db-password:latest,FLASK_SECRET_KEY=flask-secret-key:latest \
            --project project-859a403e-4363-4c9b-963